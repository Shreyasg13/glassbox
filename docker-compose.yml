name: glassbox

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      GLASSBOX_JWT_SECRET: ${GLASSBOX_JWT_SECRET:?set a real secret in .env}
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN:?set in .env}
      GLASSBOX_DB_PATH: /data/glassbox.db
      # Set to a Postgres/Neon URL to run against that instead of the
      # SQLite file above (see backend/app/db.py) -- unset stays SQLite.
      DATABASE_URL: ${DATABASE_URL:-}
      BACKEND_SOURCE_PATH: /backend-source
      TRADING_STORAGE_PATH: /data/trading-storage
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      GEMINI_INPUT_COST_PER_1M: ${GEMINI_INPUT_COST_PER_1M:-}
      GEMINI_OUTPUT_COST_PER_1M: ${GEMINI_OUTPUT_COST_PER_1M:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RATE_LIMIT_LOGIN_PER_MIN: ${RATE_LIMIT_LOGIN_PER_MIN:-10}
      RATE_LIMIT_ADMIN_PER_MIN: ${RATE_LIMIT_ADMIN_PER_MIN:-60}
      RATE_LIMIT_SIGNUP_PER_MIN: ${RATE_LIMIT_SIGNUP_PER_MIN:-5}
      WEB_CONCURRENCY: ${BACKEND_WORKERS:-2}
    volumes:
      - ./backend-source:/backend-source:ro
      - ./trading-storage:/data/trading-storage
      - glassbox-db:/data
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Same origin as the app -- backend is reached through Caddy's
        # path-based routing on APP_DOMAIN, not a separate API host.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?e.g. https://yourdomain.com}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:?e.g. wss://yourdomain.com/ws/signals}
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      # Single domain, path-based routing (see deploy/Caddyfile) -- no
      # separate API_DOMAIN needed.
      APP_DOMAIN: ${APP_DOMAIN:?e.g. yourdomain.com}
    depends_on:
      - backend
      - frontend

  # Optional local LLM host. Start with: docker compose --profile local-llm up -d
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["local-llm"]
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"

volumes:
  glassbox-db:
  caddy-data:
  caddy-config:
  ollama-data:
