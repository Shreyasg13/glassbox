name: glassbox

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      GLASSBOX_JWT_SECRET: ${GLASSBOX_JWT_SECRET:?set a real secret in .env}
      # production = the backend refuses to boot with a missing/default JWT
      # secret and refuses the built-in dev logins (see app/auth.py).
      GLASSBOX_ENV: production
      # The ONLY way to get an admin login: set the hash (preferred; make it
      # with `docker compose run --rm backend python -m app.scripts.gen_secrets
      # --admin`) or a plain password of 12+ chars. Neither set = no admin.
      GLASSBOX_ADMIN_PASSWORD_HASH: ${GLASSBOX_ADMIN_PASSWORD_HASH:-}
      GLASSBOX_ADMIN_PASSWORD: ${GLASSBOX_ADMIN_PASSWORD:-}
      GLASSBOX_TOKEN_TTL_MINUTES: ${GLASSBOX_TOKEN_TTL_MINUTES:-480}
      # Voice cost controls (see app/tts.py): ElevenLabs is skipped once this
      # many characters have been spent in a UTC day; per-client limits apply
      # to cache misses only.
      TTS_DAILY_CHAR_BUDGET: ${TTS_DAILY_CHAR_BUDGET:-30000}
      RATE_LIMIT_TTS_PER_MIN: ${RATE_LIMIT_TTS_PER_MIN:-10}
      RATE_LIMIT_TTS_PER_DAY: ${RATE_LIMIT_TTS_PER_DAY:-150}
      RATE_LIMIT_USER_REPORTS_PER_HOUR: ${RATE_LIMIT_USER_REPORTS_PER_HOUR:-6}
      PAPER_LLM_NARRATIVES: ${PAPER_LLM_NARRATIVES:-}
      PAPER_BACKTEST_START: ${PAPER_BACKTEST_START:-2021-01-04}
      PAPER_COMMISSION_BPS: ${PAPER_COMMISSION_BPS:-5}
      # LLM failover providers (docs/FREE_LLM_ROUTING.md). Unset = that provider is skipped.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      GITHUB_MODELS_TOKEN: ${GITHUB_MODELS_TOKEN:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      LLM_GATEWAY_BASE_URL: ${LLM_GATEWAY_BASE_URL:-}
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY:-}
      LLM_GATEWAY_MODELS: ${LLM_GATEWAY_MODELS:-}
      LLM_FAILOVER: ${LLM_FAILOVER:-}
      LLM_FAILOVER_ENABLED: ${LLM_FAILOVER_ENABLED:-1}
      LLM_FAILOVER_USER_RUNS: ${LLM_FAILOVER_USER_RUNS:-1}
      LLM_ROUTE_BUDGET_S: ${LLM_ROUTE_BUDGET_S:-120}
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN:?set in .env}
      # Also used directly (not just for CORS) to build the Google OAuth
      # redirect_uri and the post-login redirect back to the frontend --
      # see routers/oauth.py's _app_origin().
      APP_DOMAIN: ${APP_DOMAIN:?set in .env}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GLASSBOX_DB_PATH: /data/glassbox.db
      # Set to a Postgres/Neon URL to run against that instead of the
      # SQLite file above (see backend/app/db.py) -- unset stays SQLite.
      DATABASE_URL: ${DATABASE_URL:-}
      BACKEND_SOURCE_PATH: /backend-source
      TRADING_STORAGE_PATH: /data/trading-storage
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      GEMINI_INPUT_COST_PER_1M: ${GEMINI_INPUT_COST_PER_1M:-}
      GEMINI_OUTPUT_COST_PER_1M: ${GEMINI_OUTPUT_COST_PER_1M:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RATE_LIMIT_LOGIN_PER_MIN: ${RATE_LIMIT_LOGIN_PER_MIN:-10}
      RATE_LIMIT_ADMIN_PER_MIN: ${RATE_LIMIT_ADMIN_PER_MIN:-60}
      RATE_LIMIT_SIGNUP_PER_MIN: ${RATE_LIMIT_SIGNUP_PER_MIN:-5}
      WEB_CONCURRENCY: ${BACKEND_WORKERS:-2}
    volumes:
      - ./backend-source:/backend-source:ro
      - ./trading-storage:/data/trading-storage
      - glassbox-db:/data
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Same origin as the app -- backend is reached through Caddy's
        # path-based routing on APP_DOMAIN, not a separate API host.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?e.g. https://yourdomain.com}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:?e.g. wss://yourdomain.com/ws/signals}
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      # Single domain, path-based routing (see deploy/Caddyfile) -- no
      # separate API_DOMAIN needed.
      APP_DOMAIN: ${APP_DOMAIN:?e.g. yourdomain.com}
    depends_on:
      - backend
      - frontend

  # Optional local LLM host. Start with: docker compose --profile local-llm up -d
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["local-llm"]
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"

volumes:
  glassbox-db:
  caddy-data:
  caddy-config:
  ollama-data:
