name: ci

# The merge gate. Branch protection on `main` requires BOTH jobs below to pass before anything can be merged.
# Deliberately no `paths:` filter: a required check that is skipped never reports, which would block every
# pull request that doesn't touch that folder (e.g. a frontend-only change).
#
# Safe for pull requests from forks: no secrets, a read-only token, and no cloud credentials. The deploy
# workflow (images.yml) never runs on pull requests.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Dependency vulnerability scan
        run: python -m pip_audit -r requirements.txt --progress-spinner off

  frontend-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
